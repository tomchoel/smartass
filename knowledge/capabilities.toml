# Capability map (design §5, phase 4): which words mean which measure, and what can be answered at which grain.
# Hand-maintained beside catalog.toml (line definitions, scenarios, materiality). semantic.problems() checks that every
# concept/kpi named here exists in catalog.toml and that no synonym belongs to two measures.
# Synonyms match whole words, case-insensitive; the longest match wins ("cost per fte" beats "cost").
# Cube facts verified 2026-11-02 (atlas + live sv_members): no customer dimension in any cube; products in FinMax
# (All Products, 19 755) and FinPlan (243); FinMax currencies NOK / Local / FX Rates (no EUR); FinPlan Entity holds
# business areas and some units, not cost centres.

# ------------------------------------------------------------------ measures
# concept = a catalog [pnl] concept; kpi = a catalog [[kpi]] key; accounts = FinMax/FinLite members summed (no
# catalog line).
# vague = the word does not say which measure: the gate asks, listing `options` (unless a learned default exists).
# note = what the answer must state about the definition.

[[measure]]
key = "revenue"
concept = "revenue"
synonyms = ["revenue", "revenues", "sales", "turnover", "inntekt", "inntekter", "omsetning", "salgsinntekter"]

[[measure]]
key = "cogs"
concept = "cogs"
synonyms = ["cogs", "cost of goods sold", "cost of sales", "direct costs", "varekost", "varekostnad", "vareforbruk"]

[[measure]]
key = "gross_margin"
concept = "gross_margin"
synonyms = ["gross margin", "gross profit", "contribution margin", "bruttomargin", "bruttofortjeneste", "dekningsbidrag"]

[[measure]]
key = "personnel"
concept = "personnel"
synonyms = ["personnel cost", "personnel costs", "payroll", "salary costs", "personalkostnader", "personalkostnad",
            "lønnskostnader", "lønnskostnad"]

[[measure]]
key = "other_opex"
concept = "other_opex"
synonyms = ["other opex", "other operating expenses", "andre driftskostnader"]

[[measure]]
key = "opex"
concept = "opex"
synonyms = ["opex", "operating expenses", "operating costs", "operating cost", "driftskostnader", "driftskostnad"]

[[measure]]
key = "ebitda_boi"
concept = "ebitda_boi"
synonyms = ["ebitda before other items", "ebitda boi", "ebitda før andre poster"]

[[measure]]
key = "other_items"
concept = "other_items"
synonyms = ["other items", "andre poster", "one-offs", "one offs", "engangsposter"]

[[measure]]
key = "ebitda"
concept = "ebitda"
synonyms = ["ebitda"]

[[measure]]
key = "profit"
concept = "ebitda"
synonyms = ["profit", "profits", "profitability", "earnings", "lønnsomhet", "resultat", "overskudd"]
note = "profit is read as EBITDA (the cubes' bottom line for plan comparisons; FinPlan stops at EBITDA)"

[[measure]]
key = "da"
concept = "da"
synonyms = ["depreciation", "amortisation", "amortization", "d&a", "avskrivninger", "avskrivning"]

[[measure]]
key = "fte"
concept = "fte"
synonyms = ["fte", "ftes", "headcount", "employees", "årsverk", "ansatte"]
note = "FTE is a level: the month-end value, never a sum of months"

[[measure]]
key = "ebitda_margin"
kpi = "ebitda_margin"
synonyms = ["ebitda margin", "ebitda-margin", "ebitda %"]

[[measure]]
key = "gross_margin_pct"
kpi = "gross_margin_pct"
synonyms = ["gross margin %", "gross margin percent", "gross margin percentage", "bruttomargin %"]

[[measure]]
key = "opex_per_fte"
kpi = "opex_per_fte"
synonyms = ["cost per fte", "costs per fte", "opex per fte", "cost per employee", "kostnad per årsverk",
            "kostnader per årsverk"]
note = "Opex per FTE = opex (C70) / average FTE (opening level + each month end), annualised, shown positive"

[[measure]]
key = "personnel_per_fte"
kpi = "personnel_per_fte"
synonyms = ["personnel cost per fte", "salary per fte", "payroll per fte", "lønnskostnad per årsverk"]
note = "Personnel cost per FTE = C50S / average FTE (opening level + each month end), annualised, shown positive"

# accounts = FinLite/FinMax account members summed (same names in both cubes; looked up 2026-11-02 with
# sv_find_member/sv_members). Tree: ac.C609 -> ac.C693 (consultancy + temps) and ac.C694 (other expenses).
# finplan = the FinPlan account for a total-level budget, when one maps (none verified yet).
[[measure]]
key = "consultants"
accounts = ["ac.C60080", "ac.C60090"]
label = "Consultancy"
synonyms = ["consultants", "consultant", "consultancy", "consultancies", "consulting", "consulting firms",
            "consulting companies", "konsulent", "konsulenter", "konsulentselskap", "konsulentselskaper",
            "konsulentfirma", "konsulentfirmaer", "konsulenthonorar", "rådgivning"]
note = "C60080 + C60090; temporary contract workers (C60110) are 'contractors'"

[[measure]]
key = "consultants_and_temps"
accounts = ["ac.C693"]
label = "Consultancy and temporary contract workers"
synonyms = ["consultants and temps", "consultancy and temporary workers", "konsulenter og innleie"]
note = "C693 = C60080 + C60090 + C60110 + C60095"

[[measure]]
key = "contractors"
accounts = ["ac.C60110"]
label = "Temporary contract workers (contractors)"
synonyms = ["contractors", "temporary workers", "temps", "hired staff", "innleie", "innleid", "innleide", "vikar",
            "vikarer", "fremmedtjenester"]

[[measure]]
key = "legal"
accounts = ["ac.67410", "ac.67420", "ac.C60400"]
label = "Legal costs (fees + disputes)"
synonyms = ["legal", "legal costs", "legal expenses", "juridisk", "juridiske kostnader", "juridiske utgifter"]

[[measure]]
key = "legal_fees"
accounts = ["ac.67410", "ac.67420"]
label = "Legal fees"
synonyms = ["legal fees", "lawyers", "legal advice", "advokat", "advokater", "advokatkostnader", "juridisk bistand"]
note = "inside C60090"

[[measure]]
key = "legal_disputes"
accounts = ["ac.C60400"]
label = "Legal disputes"
synonyms = ["legal disputes", "litigation", "rettstvister", "tvister"]

[[measure]]
key = "audit_fees"
accounts = ["ac.67100", "ac.67110"]
label = "Audit fees"
synonyms = ["audit fees", "auditor", "revisjon", "revisor", "revisjonshonorar"]
note = "inside C60090"

[[measure]]
key = "travel"
accounts = ["ac.C60130"]
label = "Travel"
synonyms = ["travel", "travel costs", "travel expenses", "per diem", "reise", "reiser", "reisekostnader", "diett"]

[[measure]]
key = "management_fee"
accounts = ["ac.C60170"]
label = "Management fee"
synonyms = ["management fee", "management fees"]

[[measure]]
key = "licence_fees"
accounts = ["ac.C60180"]
label = "Licence fees"
synonyms = ["licence fees", "license fees", "lisenser", "lisenskostnader"]

[[measure]]
key = "energy"
accounts = ["ac.C60025"]
label = "Energy"
synonyms = ["energy", "electricity", "energi", "strøm", "strømkostnader"]

[[measure]]
key = "shared_services"
accounts = ["ac.C60910"]
label = "Shared services charges"
synonyms = ["shared services charges", "shared service centre"]

[[measure]]
key = "costs"
vague = true
synonyms = ["costs", "cost", "kostnader", "kostnad", "spending", "spend", "spent", "expenses", "utgifter"]
options = ["opex (C70: personnel + other opex)", "opex + COGS (all costs to EBITDA)", "personnel cost only (C50S)"]

[[measure]]
key = "numbers"
vague = true
synonyms = ["numbers", "figures", "results", "tall", "tallene", "resultater", "how are we doing", "how is it going",
            "status", "performance"]
options = ["P&L to EBITDA (revenue, COGS, opex, EBITDA)", "revenue and EBITDA", "opex"]

# ------------------------------------------------------------------ grains
# feasible = measure keys answerable at this grain ("*" = all). A measure outside the list makes the question
# infeasible as asked; `proxy` is what is answered instead.

[[grain]]
key = "product"
synonyms = ["per product", "by product", "per produkt", "product level", "per product line", "each product"]
feasible = ["revenue", "cogs", "gross_margin", "gross_margin_pct"]
proxy = "contribution margin (revenue - COGS) per product; opex is not allocated to products in FinMax (full cost per product only in Produktregnskapet, annually)"

[[grain]]
key = "customer"
synonyms = ["per customer", "by customer", "per kunde", "customer level", "per client", "each customer"]
feasible = []
proxy = "the same measure per business area / segment; there is no customer dimension in FinMax or FinPlan"

[[grain]]
key = "cost_centre"
synonyms = ["per cost centre", "per cost center", "by cost centre", "by cost center", "per kostnadssted",
            "per department", "per avdeling"]
feasible = ["*"]
note = "FinMax only: FinPlan has business areas, not cost centres, so no budget per cost centre"

[[grain]]
key = "business_area"
synonyms = ["per business area", "by business area", "per division", "by division", "per divisjon", "per segment",
            "by segment", "per forretningsområde"]
feasible = ["*"]

[[grain]]
key = "supplier"
synonyms = ["per supplier", "by supplier", "which suppliers", "which companies", "who invoiced", "invoiced most",
            "top suppliers", "biggest suppliers", "per leverandør", "hvilke leverandører", "hvilke selskaper",
            "fakturerte mest", "største leverandører"]
feasible = ["consultants", "consultants_and_temps", "contractors", "legal", "legal_fees", "legal_disputes",
            "audit_fees", "travel", "management_fee", "licence_fees", "energy", "shared_services"]
proxy = "the same measure per cost centre; supplier detail exists only in the ledger lines of account-level cost types"
note = "from ledger lines (FinLite drill)"

[[grain]]
key = "project"
synonyms = ["per project", "by project", "which projects", "initiatives", "per prosjekt", "hvilke prosjekter",
            "initiativer"]
feasible = ["consultants", "consultants_and_temps", "contractors", "legal", "legal_fees", "legal_disputes",
            "audit_fees", "travel", "management_fee", "licence_fees", "energy", "shared_services"]
proxy = "the same measure per cost centre; project detail exists only in the ledger lines of account-level cost types"
note = "from ledger lines (FinLite drill)"

[[grain]]
key = "month"
synonyms = ["per month", "by month", "monthly", "month by month", "per måned", "månedlig", "trend"]
feasible = ["*"]

# ------------------------------------------------------------------ currency
[currency]
reporting = ["NOK"]
proxy = "the values in NOK (FinMax reports NOK and Local currency only; no EUR or other translation is loaded)"

[currency.words]
nok = "NOK"
kroner = "NOK"
eur = "EUR"
euro = "EUR"
euros = "EUR"
usd = "USD"
dollar = "USD"
dollars = "USD"
sek = "SEK"
dkk = "DKK"
gbp = "GBP"
