# KPIs: ratios of two P&L line keys of one cube (computed in the workbook, never by the model).
[[kpi]]
key = "ebitda_margin"
label = "EBITDA margin"
connection = "FinMax"
numerator = "ebitda"
denominator = "rev"
unit = "pct"

[[kpi]]
key = "gross_margin_pct"
label = "Gross margin %"
connection = "FinMax"
numerator = "gm"
denominator = "rev"
unit = "pct"

[[kpi]]
key = "opex_per_fte"
label = "Opex per FTE"
connection = "FinMax"
numerator = "opex"
denominator = "fte"
unit = "nok"

[[kpi]]
key = "personnel_per_fte"
label = "Personnel cost per FTE"
connection = "FinMax"
numerator = "pers"
denominator = "fte"
unit = "nok"
