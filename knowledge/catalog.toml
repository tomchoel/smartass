# Semantic catalogue: what finance words mean in the cubes (Stage 1 of docs/specs/2026-10-25-finance-expert-design.md).
# Hand-maintained. catalog.parse() checks the structure; catalog.validate() checks every member against the atlas
# (`smartass doctor`). Sign convention as in FinMax: revenue positive, costs negative - so for every P&L line a
# higher value is better (better = "none" where that does not hold).

[pnl]
# Report order. kind: line | sum | grand. num: number-format override (tall1 = one decimal).
# concept: what the line means across cubes, unique per cube. The same key can mean different things in the two cubes
# (FinMax oth = Other opex C60, FinPlan oth = Total Other Items; FinMax gm vs FinPlan gp), so JOIN ACTUAL VS BUDGET ON
# `concept`, NEVER ON `key`. A line without a concept has no counterpart in the other cube.
# measure: flow (default; months add up) | stock (a level, see fte).
FinMax = [
  { key = "rev",    account = "ac.C30",        kind = "line",  label = "Revenue",                   concept = "revenue" },
  { key = "cogs",   account = "ac.C40S",       kind = "line",  label = "COGS",                      concept = "cogs" },
  { key = "gm",     account = "ac.C48",        kind = "sum",   label = "Gross margin",              concept = "gross_margin" },
  { key = "pers",   account = "ac.C50S",       kind = "line",  label = "Personnel cost",            concept = "personnel" },
  { key = "oth",    account = "ac.C60",        kind = "line",  label = "Other opex",                concept = "other_opex" },
  { key = "opex",   account = "ac.C70",        kind = "sum",   label = "Opex",                      concept = "opex" },
  { key = "boi",    account = "ac.EBITDA_BOI", kind = "sum",   label = "EBITDA before other items", concept = "ebitda_boi" },
  { key = "c73",    account = "ac.C73",        kind = "line",  label = "Other items",               concept = "other_items" },
  { key = "ebitda", account = "ac.EBITDA",     kind = "grand", label = "EBITDA",                    concept = "ebitda" },
  { key = "da",     account = "ac.C75",        kind = "line",  label = "Depreciation and amortisation", concept = "da" },
  # FTE (ac.STA20Y) is a stock booked as movements, measured live 2026-10-25: Periodic returns the monthly change,
  # Accumulated the month-end level. level = Accumulated at period end; never sum Periodic months; per-FTE ratios
  # divide YTD cost by the average month-end level.
  { key = "fte",    account = "ac.STA20Y",     kind = "line",  label = "FTE", better = "none", num = "tall1", concept = "fte", measure = "stock" },
]
# FinPlan stops at EBITDA: Target carries no depreciation/write-downs/other items, so EBIT variances would mislead.
FinPlan = [
  { key = "rev",    account = "Revenue",                   kind = "line",  label = "Revenue",      concept = "revenue" },
  { key = "cogs",   account = "COGS",                      kind = "line",  label = "COGS",         concept = "cogs" },
  { key = "gp",     account = "Gross_Profit",              kind = "sum",   label = "Gross profit", concept = "gross_margin" },
  { key = "opex",   account = "OPEX",                      kind = "line",  label = "Opex",         concept = "opex" },
  { key = "boi",    account = "EBITDA before Other Items", kind = "sum",   label = "EBITDA before other items", concept = "ebitda_boi" },
  { key = "oth",    account = "Total Other Items",         kind = "line",  label = "Other items",  concept = "other_items" },
  { key = "ebitda", account = "EBITDA",                    kind = "grand", label = "EBITDA",       concept = "ebitda" },
]

[checks]
# Accounting identities, as expressions over line keys that must come to 0.
FinMax = [
  { label = "C30 + C40S = C48",          expr = "rev+cogs-gm" },
  { label = "C50S + C60 = C70",          expr = "pers+oth-opex" },
  { label = "C48 + C70 = EBITDA_BOI",    expr = "gm+opex-boi" },
  { label = "EBITDA_BOI + C73 = EBITDA", expr = "boi+c73-ebitda" },
]
FinPlan = [
  { label = "Revenue + COGS = Gross profit",                    expr = "rev+cogs-gp" },
  { label = "Gross profit + OPEX = EBITDA before other items",  expr = "gp+opex-boi" },
  { label = "EBITDA before other items + Other items = EBITDA", expr = "boi+oth-ebitda" },
]

[scenarios]
actual         = { connection = "FinMax",  scenario = "Actual", label = "Actual (ledger)" }
actual_finplan = { connection = "FinPlan", scenario = "Actual", version = "Working", label = "Actual (FinPlan)" }
budget         = { connection = "FinPlan", scenario = "Target", version = "Final", label = "Target (budget)" }
forecast       = { connection = "FinPlan", rule = "latest_forecast", version = "Final", label = "Latest forecast" }

[materiality]
# Owner decision: a variance is material at 10 % OR NOK 5 million - either threshold is enough (rule = "both" would
# need both). The percentage is taken of the absolute comparison value (costs are negative, so |budget| for a cost
# line); a zero comparison value is material when the amount threshold is exceeded.
pct = 0.10                            # 10 % of |comparison value|
abs_nok = 5_000_000                   # NOK 5 million
rule = "either"                       # either | both
always = ["rev", "pers", "ebitda"]    # revenue, personnel and EBITDA are always commented, material or not

# Business areas. Aliases are matched as whole words in a question; aliases shorter than 3 characters (it, ig, ei,
# tn) only when they are the whole question or written in UPPER CASE in it ("kostnader i IT"). generic_aliases
# ("total", "selskapet") only count when no area is named: "total opex for SSM" is SSM, while a named "Telenor Norge"
# or "TN" counts like any area. A question naming several areas resolves to none of them (resolve_entities lists them). Mobile ("mobil") is a product across divisions, not an area, so it is no alias.
# abolished = the date the area was emptied (history is restated to today's org); successors = the areas that took
# over its business (the tools explain the 1 June 2026 split and query the successors instead).
[[entity]]
key = "company"
label = "Telenor Norge (total)"
finmax = "un.SY"
finplan = "BANORWAY"
aliases = ["telenor norge", "tn"]
generic_aliases = ["total", "company", "selskapet"]   # give way to a named area: "total opex for SSM" is SSM

[[entity]]
key = "wholesale"
label = "Wholesale"
finmax = "un.SY.2WHS"
finplan = "2WHS Wholesale"
aliases = ["wholesale", "grossist", "grossistmarkedet", "whs", "2whs"]

[[entity]]
key = "business"
label = "Business"
finmax = "un.SY.2BUS"
finplan = "2BUS Business"
aliases = ["business", "bedrift", "bedriftsmarked", "bedriftsmarkedet", "b2b", "2bus"]

[[entity]]
key = "ssm"
label = "Security Solutions & Mobile"
finmax = "un.SY.2SSM"
finplan = "2SSM Security Solutions & Mobile"
aliases = ["security solutions & mobile", "security solutions and mobile", "ssm", "2ssm"]

[[entity]]
key = "ei"
label = "Entertainment & Internet"
finmax = "un.SY.2EI"
finplan = "2EI Entertainment & Internet"
aliases = ["entertainment & internet", "entertainment and internet", "tv og internett", "tv & internett", "e&i", "2ei",
           "ei"]

[[entity]]
key = "technology"
label = "Technology"
finmax = "un.SY.2TEC"
finplan = "2TEC Technology"
aliases = ["technology", "teknologi", "tech", "2tec"]

[[entity]]
key = "it"
label = "IT"
finmax = "un.SY.2IT"
finplan = "2IT IT"
aliases = ["it division", "it-divisjonen", "2it", "it"]

[[entity]]
key = "adm"
label = "Norway Adm"
finmax = "un.SY.2ADM"
finplan = "2ADM Norway Adm"
aliases = ["norway adm", "administration", "administrasjon", "administrasjonen", "staff units", "stab", "stabsenheter",
           "2adm", "adm", "admin"]

[[entity]]
key = "nordics"
label = "Nordics"
finmax = "un.SY.2NRD_N"
finplan = "2NRD_N Nordics"
aliases = ["nordics", "norden", "2nrd", "2nrd_n"]

[[entity]]
key = "ig"
label = "Infrastructure Growth"
finmax = "un.SY.2IG"
finplan = "2IG Infrastructure Growth"
aliases = ["infrastructure growth", "2ig", "ig"]
abolished = "2026-06-01"
successors = []    # not recorded: which areas took over IG's units is not known to the catalogue yet
note = "Abolished in the 1 June 2026 reorg; history is restated to today's organisation."

[[entity]]
key = "consumer"
label = "Consumer Norway"
finmax = "un.SY.2CON"
aliases = ["consumer", "privat", "privatmarkedet", "2con"]
abolished = "2026-06-01"
successors = ["ssm", "ei"]
note = "Emptied into 2SSM and 2EI on 1 June 2026; history is restated, so 2CON shows no data."

# KPIs: ratios of two P&L line keys of one cube (computed in the workbook, never by the model).
# basis: period (default; both lines over the same period) | average_stock (the denominator is the average month-end
# level over the period - needs a measure = "stock" line). annualise: scale a part-year numerator to twelve months
# (YTD Sep cost x 12/9), so cost per FTE is comparable across periods.
[[kpi]]
key = "ebitda_margin"
label = "EBITDA margin"
connection = "FinMax"
numerator = "ebitda"
denominator = "rev"
unit = "pct"

[[kpi]]
key = "gross_margin_pct"
label = "Gross margin %"
connection = "FinMax"
numerator = "gm"
denominator = "rev"
unit = "pct"

[[kpi]]
key = "opex_per_fte"
label = "Opex per FTE"
connection = "FinMax"
numerator = "opex"
denominator = "fte"
unit = "nok"
basis = "average_stock"
annualise = true

[[kpi]]
key = "personnel_per_fte"
label = "Personnel cost per FTE"
connection = "FinMax"
numerator = "pers"
denominator = "fte"
unit = "nok"
basis = "average_stock"
annualise = true
