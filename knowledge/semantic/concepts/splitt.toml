title = "Splitt - direct profitability"
names = [
  "splitt",
  "splitt lønnsomhet",
  "delbetaling",
  "avbetaling",
  "håndsett på avbetaling",
  "handset instalment",
  "split payment",
]
kind = "product_offer"
description = "Telenor Consumer's offer to buy handsets and equipment on instalments, with optional Pluss insurance (Plussforsikring) and dedicated Splitt subscriptions. Profitability = direct contribution from FinMax."
entity = "un.SY"
source = "manual"
status = "approved"
notes = [
  "Profitability = direct contribution from FinMax (not the fully allocated product cost accounts, Produktregnskapet).",
  "Tagging: (booked) = tagged on a Splitt product or cost centre; (estimated) = shared amount × key; (attributed) = not tagged, but belongs to Splitt in full.",
  "Other accounts booked on the Splitt products (losses on receivables, freight, marketing, discounts, fees) are included automatically in the C40S/C70 lines.",
  "Against last year: commission on FV081 (C60140) and interest income C80311 were first booked in Q4 2025, so year to date against last year's year to date shows large changes.",
  "Pluss insurance (F4046) grew strongly from 2025 to 2026; the key for the insurance content cost follows it (share of insurance revenue).",
  "Trade-in is allocated with the handset key (Splitt's share of handset revenue), because trade-in concerns all handset sales. Chosen 15.10.2026 for want of a better source; immaterial: trade-in in total is -3.5 MNOK YTD Sep 26, so 0 % or 100 % moves the contribution by less than 3 %.",
]

