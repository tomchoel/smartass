text = "FinPlan Target has no value on these lines (other items, write-downs and the listed product lines): compare them against budget only at their total. Since FY26 Target does carry D&A, EBIT, profit before tax and CAPEX (verified live 10.11: Target FY26 D&A -6 910, EBIT 7 784, PBT 7 127 MNOK), so budget comparisons can go below EBITDA to EBIT and PBT."
