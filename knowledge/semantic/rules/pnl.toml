source = "catalog.toml [pnl] + [checks]"
status = "approved"
title = "P&L chain"
text = "FinMax: C30 + C40S = C48; C50S + C60 = C70; C48 + C70 = EBITDA_BOI; + C73 = EBITDA; D&A C75 below. FinPlan: Revenue + COGS = Gross_Profit; + OPEX = EBITDA before Other Items; + Total Other Items = EBITDA (FinPlan stops at EBITDA). Join actual vs budget on the metric, never on the line key."
kind = "pnl"

[approved]
by = "tom"
on = "2026-10-15"
via = "catalog.toml"

[data]
FinMax = [
  "revenue",
  "cogs",
  "gross_margin",
  "personnel",
  "other_opex",
  "opex",
  "ebitda_boi",
  "other_items",
  "ebitda",
  "da",
  "fte",
]
FinPlan = ["revenue", "cogs", "gross_margin", "opex", "ebitda_boi", "other_items", "ebitda"]

[data.checks]

[[data.checks.FinMax]]
label = "C30 + C40S = C48"
expr = "rev+cogs-gm"

[[data.checks.FinMax]]
label = "C50S + C60 = C70"
expr = "pers+oth-opex"

[[data.checks.FinMax]]
label = "C48 + C70 = EBITDA_BOI"
expr = "gm+opex-boi"

[[data.checks.FinMax]]
label = "EBITDA_BOI + C73 = EBITDA"
expr = "boi+c73-ebitda"

[[data.checks.FinPlan]]
label = "Revenue + COGS = Gross profit"
expr = "rev+cogs-gp"

[[data.checks.FinPlan]]
label = "Gross profit + OPEX = EBITDA before other items"
expr = "gp+opex-boi"

[[data.checks.FinPlan]]
label = "EBITDA before other items + Other items = EBITDA"
expr = "boi+oth-ebitda"
