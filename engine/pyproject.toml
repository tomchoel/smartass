[project]
name = "smartass"
version = "0.3.0"
description = "smartass engine: read-only Smart View (FinMax / FinLite / FinPlan) for AI agents and Excel"
requires-python = ">=3.12"
dependencies = [
    "mcp==2.3.0",
    "pydantic==2.14.1",
    "pywin32==312",
    "psutil==7.2.2",
    "openpyxl",
    "xlsxwriter==3.3.1",
    "playwright==1.64.0",
]

[dependency-groups]
dev = [
    "pytest",
    "anyio",
    "ruff",
    "formulas>=1.3.4",
    "pytest-cov>=7.1.0",
]

[project.scripts]
smartass = "smartass.ops.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["smartass"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["live", "fixtures"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["smartass/xl/vendor"]

[tool.ruff.lint]
select = ["E9", "F"]
