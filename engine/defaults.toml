# Org defaults for every smartass user (in git). Per-user overrides: %LOCALAPPDATA%\smartass\config.toml.
# Environment variables (SV_*, SMARTASS_*) override both.

[epm]
base = "https://plan1-telenorepm.epm.eu-frankfurt-1.ocs.oraclecloud.com"

[label]          # Telenor sensitivity label "Internal", applied before any Excel SaveAs
id = "f604d2c9-1577-460e-b668-57374a0216c3"
site = "1676489c-5c72-46b7-ba63-9ab90c4aad44"
name = "Internal"   # the label's name and the content bits Excel records for it (a new workbook's built file)
content_bits = 2

[archive]        # under the user's OneDrive for Business root; never written unless explicitly allowed
subdir = "Analyse (Telenor Norge AS) - Produktregnskapet"

[oauth]          # grids and drill lines over plain HTTPS with the user's own OAuth token (smartass login). Required:
idcs = ""        # without idcs, client_id and at least one scope no call reaches EPM. The identity domain's base URL,
client_id = ""   # and a PUBLIC client registered there with device-code + refresh-token grants (no secret exists).
# One scope per pod (a token covers one environment), keyed by the pod's base URL:
# [oauth.scopes]
# "https://<pod host>" = "urn:opc:serviceInstanceID=<id>urn:opc:resource:consumer::all"

[svhttp]         # Smart View HTTP route: data sources by Server name (several share app FinMax, one is the test pod)
finmax_server = "FinMax"                  # plan1 prod (FinMax and FinLite)
finplan_server = "FinPlan_for_DataLoad"   # stratmodel
allow_test = false                        # true admits a pod whose host contains "-test"
